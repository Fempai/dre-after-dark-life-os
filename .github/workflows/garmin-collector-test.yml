name: Garmin health sync

on:
  schedule:
    - cron: '15 14 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Days to collect (1 = today only, max 90)'
        required: true
        default: '1'
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r garmin-collector/requirements.txt
      - run: python garmin-collector/collector.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIFEOS_USER_ID: ${{ secrets.LIFEOS_USER_ID }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
