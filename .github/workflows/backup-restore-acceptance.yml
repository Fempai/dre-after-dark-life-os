name: Life OS backup restore acceptance
on:
  push:
    paths:
      - 'backup-release.js'
      - 'state-guard.js'
      - 'scripts/backup-restore-acceptance.cjs'
      - '.github/workflows/backup-restore-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/backup-restore-acceptance.cjs
