name: Encrypted journal privacy acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - 'journal-vault.js'
      - 'scripts/journal-vault-acceptance.cjs'
      - '.github/workflows/journal-vault-acceptance.yml'
      - 'index.html'
jobs:
  encrypted-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: sleep 45
      - run: node scripts/journal-vault-acceptance.cjs
