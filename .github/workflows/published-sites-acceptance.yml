name: Published Life OS and Movement browser acceptance
on:
  push:
    paths:
      - 'scripts/published-sites-acceptance.cjs'
      - '.github/workflows/published-sites-acceptance.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 1'
permissions:
  contents: read
jobs:
  published-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Allow Pages deployment to settle
        run: sleep 45
      - run: node scripts/published-sites-acceptance.cjs
